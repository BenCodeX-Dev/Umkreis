# Weekly update pull requests for npm packages and the pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8.73 accepts only typescript <6.1.0 (peer dependency); a newer typescript makes
      # npm ci fail and would hold back the whole dev-dependencies group. Remove once typescript-eslint allows it.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
